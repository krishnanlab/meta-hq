<text x="260" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" xml:space="preserve">liver</text>
<circle cx="303.0" cy="212" r="13" fill="#c53030" stroke="#c53030" stroke-width="1.5"/>
<text x="303.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">-1</text>
