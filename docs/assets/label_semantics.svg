<text x="400" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" xml:space="preserve">brain</text>
<circle cx="443.0" cy="212" r="13" fill="#c53030" stroke="#c53030" stroke-width="1.5"/>
<text x="443.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">-1</text>
<rect x="505.0" y="210" width="90" height="40" rx="20" fill="#ffffff" stroke="#c53030" stroke-width="1.5"/>
<text x="550" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle" xml:space="preserve">kidney</text>
<circle cx="593.0" cy="212" r="13" fill="#c53030" stroke="#c53030" stroke-width="1.5"/>
<text x="593.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">-1</text>
