<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" role="img" aria-label="How annotate and label modes use the ontology">
<title>How annotate and label modes use the ontology</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">Query: heart (UBERON:0000948)</text>
<text x="30" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">Each sample&#x27;s most specific annotation is compared with the query term through the ontology.</text>
