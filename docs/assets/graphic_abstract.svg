<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590" role="img" aria-label="MetaHQ graphic abstract">
<title>MetaHQ graphic abstract</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">MetaHQ: community-curated metadata for public omics data</text>
<text x="30" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">Harmonize expert annotations of GEO/SRA samples and studies once; query them as tables or ML-ready labels.</text>
<rect x="30" y="95" width="250" height="330" rx="8" fill="#e3f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
<text x="44" y="119" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2f6fa8" text-anchor="start" xml:space="preserve">13 curation sources</text>
<text x="44" y="141" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Keyed by GEO (GSM / GSE):</text>
<text x="44" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  ALE, CREEDS, DiSignAtlas,</text>
<text x="44" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  Gemma, Golightly_2018,</text>
<text x="44" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  Johnson_2023, KrishnanLab,</text>
<text x="44" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  Sirota_2011, URSA, URSA_HD</text>
<text x="44" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve"></text>
<text x="44" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Keyed by SRA (SRR / SRX):</text>
<text x="44" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  BGee, Cello, Gu_2023,</text>
<text x="44" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  Johnson_2023</text>
<text x="44" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve"></text>
<text x="44" y="311" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Each with its own vocabulary,</text>
<text x="44" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">IDs and license</text>
<rect x="330" y="95" width="250" height="330" rx="8" fill="#fdf0dc" stroke="#b7791f" stroke-width="1.5"/>
<text x="344" y="119" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b7791f" text-anchor="start" xml:space="preserve">Harmonize (metahq-build)</text>
<text x="344" y="141" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Map terms to ontologies</text>
<text x="344" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  tissue  -&gt; UBERON / CL</text>
<text x="344" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  disease -&gt; MONDO</text>
<text x="344" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  sex     -&gt; M / F</text>
<text x="344" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  age     -&gt; 7 age groups</text>
<text x="344" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Map SRA IDs to GSM (OmicIDX)</text>
<text x="344" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Keep the most specific term</text>
<text x="344" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Tag each annotation with</text>
<text x="344" y="277" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  source + evidence code</text>
<text x="344" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  (expert / crowd)</text>
<text x="344" y="311" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">Merge to sample and series</text>
<text x="344" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  level records</text>
<rect x="630" y="95" width="230" height="330" rx="8" fill="#eceff3" stroke="#52606d" stroke-width="1.5"/>
<text x="644" y="119" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#52606d" text-anchor="start" xml:space="preserve">Data package (Zenodo)</text>
<text x="644" y="155" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">annotations/</text>
<text x="654" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">sample + series BSON</text>
<text x="644" y="201" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">ontology/</text>
<text x="654" y="219" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">relations matrices,</text>
<text x="654" y="237" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">term search index</text>
<text x="644" y="265" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">metadata/</text>
<text x="654" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">GEO text fields,</text>
<text x="654" y="301" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">platforms, links,</text>
<text x="654" y="319" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">refine.bio IDs</text>
<text x="644" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" font-style="italic" xml:space="preserve">metahq setup downloads it</text>
<rect x="910" y="95" width="240" height="150" rx="8" fill="#e3f5ea" stroke="#2f855a" stroke-width="1.5"/>
<text x="924" y="119" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2f855a" text-anchor="start" xml:space="preserve">metahq CLI</text>
<text x="924" y="141" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">search    text -&gt; term IDs</text>
<text x="924" y="157" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">retrieve  tissues | diseases</text>
<text x="924" y="173" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">          | sex | age</text>
<text x="924" y="189" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">filters   species, tech,</text>
<text x="924" y="205" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">          ecode, license</text>
<rect x="910" y="270" width="240" height="155" rx="8" fill="#e3f5ea" stroke="#2f855a" stroke-width="1.5"/>
<text x="924" y="294" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2f855a" text-anchor="start" xml:space="preserve">You get</text>
<text x="924" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">result.parquet / .tsv / .json</text>
<text x="924" y="333" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  annotate: 0 / 1</text>
<text x="924" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  label: +1 / 0 / -1 / 2</text>
<text x="924" y="367" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">  + sources, external links</text>
<text x="924" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">CITATION.txt per query</text>
<text x="924" y="401" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start" xml:space="preserve">optional refine.bio dataset</text>
<line x1="284" y1="260" x2="324" y2="260" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="584" y1="260" x2="624" y2="260" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="864" y1="260" x2="904" y2="260" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1030" y1="245" x2="1030" y2="266" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="450" width="860" height="80" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="46" y="475" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">Ontology-aware labels</text>
<text x="46" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">Query &#x27;heart&#x27;: a myocardium sample is +1 (descendant), an &#x27;organ&#x27; sample is 0 (ancestor: unknown),</text>
<text x="46" y="514" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">a liver sample is -1. Disease controls from a study with cases get 2.</text>
<rect x="910" y="440" width="186.39999999999998" height="122" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="922" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start" xml:space="preserve">Legend</text>
<rect x="922" y="465" width="22" height="14" rx="3" fill="#e3f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
<text x="952" y="476" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">community sources</text>
<rect x="922" y="487" width="22" height="14" rx="3" fill="#fdf0dc" stroke="#b7791f" stroke-width="1.5"/>
<text x="952" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">build pipeline</text>
<rect x="922" y="509" width="22" height="14" rx="3" fill="#eceff3" stroke="#52606d" stroke-width="1.5"/>
<text x="952" y="520" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">distributed files</text>
<rect x="922" y="531" width="22" height="14" rx="3" fill="#e3f5ea" stroke="#2f855a" stroke-width="1.5"/>
<text x="952" y="542" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" xml:space="preserve">what you run / get</text>
</svg>
