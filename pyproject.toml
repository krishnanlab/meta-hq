    "mkdocs-material",
    "mkdocs-click",
    "marimo>=0.23.3",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "setuptools>=84.1.0",
    "scipy>=1.17.1",
    "pillow>=13.0.0",
    "pylint>=4.0.9",
    "pyinstaller>=6.20.0",
